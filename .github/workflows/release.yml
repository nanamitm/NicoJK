name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v20260821)'
        required: false

permissions:
  contents: write

env:
  JKCNSL_VERSION: v20261001
  JKCNSL_SHA256: 6a6f355f3e9bf99f259e5318d837ef126875413ed4616d681ae91fb2961bf313

jobs:
  build:
    # windows-latest が VS18 系に更新され v143 ツールセットが消えたため固定 (MSB8020 回避)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # jkcnslのライセンスとREADMEを、成果物と同じタグから取得する。
      - name: Checkout jkcnsl metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nanamitm/jkcnsl
          ref: ${{ env.JKCNSL_VERSION }}
          path: jkcnsl-source

      - name: Get version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}'
          } elseif ('${{ github.event.inputs.version }}') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = 'manual-${{ github.run_number }}'
          }
          Write-Output "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      # NuGetもvcpkgも不要 (WebView2のヘッダーと静的ローダー、zlibのソースは
      # いずれもリポジトリに同梱している)
      - name: Build
        shell: pwsh
        run: |
          foreach ($p in @('Win32', 'x64')) {
            msbuild /m /p:Configuration=Release /p:Platform=$p NicoJK.sln
            if ($LASTEXITCODE -ne 0) { throw "build failed: $p" }
          }

      - name: Download jkcnsl release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "jkcnsl-windows-x64-$env:JKCNSL_VERSION.zip"
          New-Item -ItemType Directory -Force -Path 'dist/jkcnsl-download' | Out-Null
          gh release download $env:JKCNSL_VERSION `
            --repo nanamitm/jkcnsl `
            --pattern $asset `
            --dir 'dist/jkcnsl-download'
          if ($LASTEXITCODE -ne 0) { throw "jkcnsl download failed: $asset" }

          $archive = Join-Path 'dist/jkcnsl-download' $asset
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:JKCNSL_SHA256) {
            throw "jkcnsl checksum mismatch: expected $env:JKCNSL_SHA256, actual $actualHash"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath 'dist/jkcnsl-expanded'
          if (-not (Test-Path 'dist/jkcnsl-expanded/jkcnsl/jkcnsl.exe')) {
            throw 'jkcnsl.exe was not found in the release archive'
          }
          if (-not (Test-Path 'dist/jkcnsl-expanded/jkcnsl/JkcnslLoginWindow.exe')) {
            throw 'JkcnslLoginWindow.exe was not found in the release archive'
          }
          Copy-Item 'jkcnsl-source/License.txt', 'jkcnsl-source/Readme.txt' `
            'dist/jkcnsl-expanded/jkcnsl/'

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $dir = "dist/NicoJK-$env:VERSION"
          New-Item -ItemType Directory -Force -Path "$dir/x86", "$dir/x64" | Out-Null
          # Win32構成の出力はRelease/、x64構成の出力はx64/Release/
          Copy-Item 'Release/NicoJK.tvtp', 'Release/jkimlog.exe', 'Release/jkrdlog.exe' "$dir/x86/"
          Copy-Item 'x64/Release/NicoJK.tvtp', 'x64/Release/jkimlog.exe', 'x64/Release/jkrdlog.exe' "$dir/x64/"
          Copy-Item 'NicoJK.ini', 'Readme.txt', 'ChangeLog.txt', 'jkch.sh.txt' $dir
          Copy-Item -Recurse 'dist/jkcnsl-expanded/jkcnsl' "$dir/jkcnsl"
          Compress-Archive -Path $dir -DestinationPath "dist/NicoJK-$env:VERSION.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NicoJK-${{ steps.version.outputs.VERSION }}
          path: dist/NicoJK-${{ steps.version.outputs.VERSION }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: dist/NicoJK-${{ steps.version.outputs.VERSION }}.zip
          body: |
            JkcnslLoginWindowを含むjkcnsl ${{ env.JKCNSL_VERSION }} を同梱しています。
            `jkcnsl` フォルダの中身をTVTest.exeのあるフォルダに配置してください。
